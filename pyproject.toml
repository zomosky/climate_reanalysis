[project]
name = "climate-reanalysis"
version = "0.1.0"
description = "climate_pipeline reanalysis sub-project: continuous ERA5 accumulation (download -> manifest -> monthly national zarr)"
requires-python = ">=3.11"
dependencies = [
    "ecmwf-datastores-client>=0.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6",
    "structlog>=24",
    "xarray>=2024.6",
    "zarr>=3.0",
    "netcdf4>=1.6",
]

[project.scripts]
climate_reanalysis = "climate_reanalysis.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climate_reanalysis"]
